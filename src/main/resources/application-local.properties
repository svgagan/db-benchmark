# =============================================================
# Profile: local
# Uses the Docker Compose setup defined in docker-compose.yml.
# No SSL, no IAM auth — plain username/password.
# Override any value with the corresponding env var
# (e.g. pg.host → PG_HOST).
# =============================================================

# --- PostgreSQL (Docker Compose) ---
pg.host=localhost
pg.port=5432
pg.db=core_data_db
pg.schema=benchmark
pg.user=bench
pg.password=bench

# --- MongoDB (Docker Compose) ---
mongo.host=localhost
mongo.port=27017
mongo.db=benchmark

# --- Benchmark parameters ---
benchmark.user-count=100000
benchmark.warmup=5
benchmark.iterations=500
