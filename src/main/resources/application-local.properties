# =============================================================
# Profile: local
# Uses the Docker Compose setup defined in docker-compose.yml.
# No SSL, no IAM auth — plain username/password.
# Override any value with the corresponding env var
# (e.g. pg.host → PG_HOST).
# =============================================================

# --- PostgreSQL (Docker Compose) ---
pg.host=localhost
pg.port=5432
pg.db=core_data_db
pg.schema=benchmark
pg.user=bench
pg.password=bench

# --- MongoDB (Docker Compose) ---
mongo.host=localhost
mongo.port=27017
mongo.db=benchmark

# --- Benchmark parameters ---
benchmark.record-count=1000000
benchmark.warmup=5
benchmark.iterations=500

# --- Seeding parameters ---
benchmark.seed-threads=4
benchmark.seed-chunk-size=10000
benchmark.pg-seed-batch-size=5000
benchmark.mongo-seed-batch-size=1000
benchmark.insert-pool-size=50000

# --- Stress test parameters ---
benchmark.concurrent-users=20
benchmark.stress-duration-seconds=60
benchmark.stress-select-pct=60
benchmark.stress-insert-pct=25
benchmark.stress-update-pct=15
