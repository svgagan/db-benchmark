# =============================================================
# Profile: prod
# Set BENCHMARK_PROFILE=prod to activate this profile.
#
# Every value below can be overridden by the corresponding
# environment variable (dot → underscore, all uppercase).
# Example: pg.host → PG_HOST
#
# Values left blank here MUST be supplied via env var.
# =============================================================

# --- PostgreSQL (Amazon RDS) ---
# IAM auth token is generated at runtime — no password needed.
# The DB user must have the rds_iam role:
#   GRANT rds_iam TO <pg.user>;
#
pg.host=
pg.port=5432
pg.db=benchmark
pg.user=

# SSL mode for RDS connection.
# Options: require (no CA verification) | verify-full (recommended, needs ca file)
pg.ssl.mode=verify-full

# Path to the RDS CA bundle. Download from:
# https://truststore.pki.rds.amazonaws.com/global/global-bundle.pem
# Leave blank to use the JVM default trust store (works for verify-ca).
pg.ssl.ca-file=

# AWS region for IAM token generation (must match the RDS region).
aws.region=us-east-1

# --- DocumentDB ---
# TLS is mandatory on DocumentDB — always enabled in prod profile.
# Credentials are supplied via env vars: MONGO_USER / MONGO_PASSWORD
#
mongo.host=
mongo.port=27017
mongo.db=benchmark
mongo.user=
mongo.password=

# Optional: path to the DocumentDB CA bundle. Download from:
# https://truststore.pki.rds.amazonaws.com/global/global-bundle.pem
# (same bundle is used for both RDS and DocumentDB)
# Leave blank to use the JVM default trust store.
mongo.tls.ca-file=

# --- Benchmark parameters ---
benchmark.user-count=100000
benchmark.warmup=5
benchmark.iterations=500
