# =============================================================
# Profile: prod
# Set BENCHMARK_PROFILE=prod to activate this profile.
#
# Every value below can be overridden by the corresponding
# environment variable (dot → underscore, all uppercase).
# Example: pg.host → PG_HOST, pg.password → PG_PASSWORD
#
# Values left blank here MUST be supplied via env var.
# =============================================================

# --- PostgreSQL (Amazon RDS) ---
# Plain username/password auth over SSL.
# Supply credentials via env vars: PG_USER / PG_PASSWORD
#
pg.host=
pg.port=5432
pg.db=core_data_db
pg.schema=benchmark
pg.user=
pg.password=

# SSL mode for RDS connection.
# Options: require (no CA verification) | verify-full (recommended, needs ca file)
pg.ssl.mode=verify-full

# Path to the RDS CA bundle. Download from:
# https://truststore.pki.rds.amazonaws.com/global/global-bundle.pem
# Leave blank to use the JVM default trust store (works for verify-ca).
pg.ssl.ca-file=

# --- DocumentDB ---
# TLS is mandatory on DocumentDB — always enabled in prod profile.
# Credentials are supplied via env vars: MONGO_USER / MONGO_PASSWORD
#
mongo.host=
mongo.port=27017
mongo.db=benchmark
mongo.user=
mongo.password=

# Optional: path to the DocumentDB CA bundle. Download from:
# https://truststore.pki.rds.amazonaws.com/global/global-bundle.pem
# (same bundle is used for both RDS and DocumentDB)
# Leave blank to use the JVM default trust store.
mongo.tls.ca-file=

# --- Benchmark parameters ---
benchmark.record-count=1000000
benchmark.warmup=5
benchmark.iterations=500

# --- Seeding parameters ---
benchmark.seed-threads=4
benchmark.seed-chunk-size=10000
benchmark.pg-seed-batch-size=5000
benchmark.mongo-seed-batch-size=1000
benchmark.insert-pool-size=50000

# --- Stress test parameters ---
benchmark.concurrent-users=20
benchmark.stress-duration-seconds=60
benchmark.stress-select-pct=60
benchmark.stress-insert-pct=25
benchmark.stress-update-pct=15
